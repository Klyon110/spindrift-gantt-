<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spindrift Gantt</title>
<script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f0f4f9;padding:16px;overflow-x:auto;}
h2{color:#1a2340;font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #2563eb;}
.cards{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.card{background:#fff;border-radius:8px;padding:12px 20px;box-shadow:0 1px 4px #ccc;min-width:100px;}
.card-label{font-size:11px;color:#6b7a99;text-transform:uppercase;}
.card-value{font-size:24px;font-weight:700;}
.gantt-wrap{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;}
.gantt-header{display:grid;grid-template-columns:200px 1fr;background:#1e3a6e;color:#fff;font-size:11px;font-weight:600;padding:8px 0;}
.gantt-header-left{padding:0 12px;}
.gantt-header-right{display:flex;border-left:1px solid rgba(255,255,255,.2);}
.gantt-header-right span{flex:1;text-align:center;padding:0 4px;font-size:10px;border-right:1px solid rgba(255,255,255,.1);}
.gantt-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid #eef2f7;min-height:40px;}
.gantt-row:hover{background:#f8faff;}
.gantt-left{padding:10px 12px;font-size:12px;border-right:1px solid #eef2f7;}
.gantt-jc{font-weight:700;color:#2563eb;font-size:12px;}
.gantt-task{color:#6b7a99;font-size:11px;margin-top:2px;}
.gantt-right{position:relative;background:#f8faff;}
.gantt-bar{position:absolute;height:22px;top:9px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;}
#msg{text-align:center;padding:40px;color:#6b7a99;font-size:14px;}
.legend{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7a99;}
.legend-dot{width:12px;height:12px;border-radius:3px;}
</style>
</head>
<body>
<h2>&#9638; Spindrift Solutions &mdash; Gantt Chart</h2>
<div id="msg">Loading records...</div>
<div id="main" style="display:none">
  <div class="cards">
    <div class="card"><div class="card-label">Total Tasks</div><div class="card-value" id="c-total" style="color:#1a2340">0</div></div>
    <div class="card" style="border-top:3px solid #22c55e"><div class="card-label">Done</div><div class="card-value" id="c-done" style="color:#22c55e">0</div></div>
    <div class="card" style="border-top:3px solid #f59e0b"><div class="card-label">In Progress</div><div class="card-value" id="c-prog" style="color:#f59e0b">0</div></div>
    <div class="card" style="border-top:3px solid #3b82f6"><div class="card-label">Planned</div><div class="card-value" id="c-plan" style="color:#3b82f6">0</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Completed</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>In Progress</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Planned</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>On Hold</div>
  </div>
  <div class="gantt-wrap">
    <div class="gantt-header">
      <div class="gantt-header-left">Job Card / Task</div>
      <div class="gantt-header-right" id="date-headers"></div>
    </div>
    <div id="gantt-body"></div>
  </div>
</div>
<script>
var COLORS={"In Progress":"#f59e0b","Completed":"#22c55e","Planned":"#3b82f6","On Hold":"#ef4444"};

function parseDate(s){
  if(!s) return null;
  var months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var m=s.match(/(\d{2})-([A-Za-z]{3})-(\d{4})/);
  if(m) return new Date(parseInt(m[3]),months[m[2]],parseInt(m[1]));
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  return null;
}

function fmtDate(d){
  var mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+"-"+mn[d.getMonth()];
}

function addDays(d,n){return new Date(d.getTime()+n*86400000);}

ZOHO.CREATOR.init().then(function(){
  ZOHO.CREATOR.API.getAllRecords({
    reportName:"Gantt_Chart_Sample_Subform_Report",
    page:1,pageSize:200
  }).then(function(res){
    var data=res.data||[];
    if(data.length===0){
      document.getElementById("msg").innerHTML="No records found.";
      return;
    }

    // Find date range
    var minD=null, maxD=null;
    data.forEach(function(r){
      var s=parseDate(r.Start_Date), e=parseDate(r.End_Date);
      if(s&&(!minD||s<minD)) minD=s;
      if(e&&(!maxD||e>maxD)) maxD=e;
    });
    if(!minD) minD=new Date();
    if(!maxD) maxD=addDays(minD,14);
    // Add padding
    minD=addDays(minD,-1);
    maxD=addDays(maxD,1);
    var totalDays=Math.round((maxD-minD)/86400000);

    // Build date headers
    var hdrs="";
    for(var i=0;i<totalDays;i++){
      var d=addDays(minD,i);
      hdrs+="<span>"+fmtDate(d)+"</span>";
    }
    document.getElementById("date-headers").innerHTML=hdrs;

    // Count statuses
    var total=data.length,done=0,prog=0,plan=0;
    data.forEach(function(r){
      var st=r.Progress||"Planned";
      if(st=="Completed") done++;
      else if(st=="In Progress") prog++;
      else if(st=="Planned") plan++;
    });
    document.getElementById("c-total").textContent=total;
    document.getElementById("c-done").textContent=done;
    document.getElementById("c-prog").textContent=prog;
    document.getElementById("c-plan").textContent=plan;

    // Build rows
    var html="";
    data.forEach(function(r){
      var jc=r.New_Quotation||"";
      var task=r.Task_Details||"";
      var st=r.Progress||"Planned";
      var pct=parseInt(r.Completed)||0;
      var s=parseDate(r.Start_Date);
      var e=parseDate(r.End_Date);
      var color=COLORS[st]||"#3b82f6";
      var leftPct=0, widthPct=100;
      if(s&&e){
        leftPct=Math.round((s-minD)/86400000/totalDays*100);
        widthPct=Math.max(2,Math.round((e-s)/86400000/totalDays*100));
      }
      html+="<div class='gantt-row'>";
      html+="<div class='gantt-left'><div class='gantt-jc'>"+jc+"</div><div class='gantt-task'>"+task+"</div><div style='margin-top:3px'><span class='badge' style='background:"+color+"22;color:"+color+"'>"+st+"</span></div></div>";
      html+="<div class='gantt-right'><div class='gantt-bar' style='left:"+leftPct+"%;width:"+widthPct+"%;background:"+color+";'><span>"+pct+"%</span></div></div>";
      html+="</div>";
    });
    document.getElementById("gantt-body").innerHTML=html;
    document.getElementById("msg").style.display="none";
    document.getElementById("main").style.display="";
  }).catch(function(e){
    document.getElementById("msg").innerHTML="Error: "+JSON.stringify(e);
  });
}).catch(function(e){
  document.getElementById("msg").innerHTML="Init error: "+JSON.stringify(e);
});
</script>
</body>
</html>
