<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spindrift Gantt</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f0f4f9;}
.hdr{background:#2a5298;color:#fff;padding:12px 20px;font-size:15px;font-weight:bold;}
.body{padding:20px;}
.msg{background:#fff;border:1px solid #dde;border-radius:8px;padding:20px;color:#333;}
</style>
</head>
<body>
<div class="hdr">Spindrift Solutions - Gantt</div>
<div class="body">
  <div class="msg" id="msg">Loading...</div>
</div>
<script>
var el = document.getElementById('msg');
if (typeof ZOHO !== 'undefined' && ZOHO.CREATOR) {
  ZOHO.CREATOR.init().then(function() {
    el.innerHTML = '<b style="color:green">Zoho SDK connected! Widget is working.</b>';
  }).catch(function(e) {
    el.innerHTML = '<b>SDK error: </b>' + JSON.stringify(e);
  });
} else {
  el.innerHTML = '<b style="color:blue">Running outside Zoho - demo mode.</b>';
}
</script>
</body>
</html>
