<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spindrift Solutions – Production Gantt</title>

<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  SPINDRIFT SOLUTIONS — ZOHO CREATOR GANTT WIDGET                   ║
  ║                                                                      ║
  ║  Mapped to your actual form fields:                                  ║
  ║   Task_Title_name          → bar label / task name                  ║
  ║   Jobcard_No               → groups tasks under a job card          ║
  ║   Task_Status              → Planned / In Progress / Done           ║
  ║   Task_Estimated_Completion_Date → end date reference               ║
  ║   Task_Rand_Value          → budget value (shown in tooltip)        ║
  ║   Date_Time_Start_date     → bar start (drives Gantt position)      ║
  ║   Date_Time_End_date       → bar end   (drives Gantt width)         ║
  ║   Task_Details             → dropdown — task type / category        ║
  ║   Task_Status_Time_Stamp   → last status update                     ║
  ║   Task_Progress_Completed  → 0-100 numeric → green progress line    ║
  ║   Task_Completion_Rand_Value → cost at completion                   ║
  ║   Task_Rand_Value_O_S      → outstanding value                      ║
  ║   Building_Sites           → site filter dropdown                   ║
  ║   Task_Status_User         → who last updated                       ║
  ║   Task_Status_Note         → free-text note shown in tooltip        ║
  ║                                                                      ║
  ║  DEPLOYMENT:                                                         ║
  ║   1. Settings → Widgets → New Widget → upload this file zipped      ║
  ║   2. Add Widget component to any Zoho Creator page                  ║
  ║   3. Edit ZOHO_CONFIG below — set appName & reportName              ║
  ║   4. Field API names are pre-filled from your screenshot            ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* Spindrift brand tones — cool steel-blue palette */
  --bg:          #f0f4f9;
  --surface:     #ffffff;
  --surface2:    #f7f9fc;
  --surface3:    #eef2f7;
  --border:      rgba(30,60,114,.10);
  --border2:     rgba(30,60,114,.18);
  --text:        #1a2340;
  --muted:       #6b7a99;
  --accent:      #2563eb;
  --accent-dim:  rgba(37,99,235,.08);
  --accent-mid:  rgba(37,99,235,.18);

  /* header gradient matching Spindrift UI */
  --header-grad: linear-gradient(135deg, #1e3c72 0%, #2a5298 60%, #4a80c4 100%);

  /* status */
  --done-bg:#dcfce7; --done-fg:#15803d; --done-br:#86efac;
  --prog-bg:#dbeafe; --prog-fg:#1d4ed8; --prog-br:#93c5fd;
  --plan-bg:#f1f5f9; --plan-fg:#64748b; --plan-br:#cbd5e1;
  --hold-bg:#fef3c7; --hold-fg:#92400e; --hold-br:#fcd34d;

  /* progress green */
  --progress:      #16a34a;
  --progress-glow: rgba(22,163,74,.30);
  --progress-dim:  rgba(22,163,74,.15);
  --progress-track:rgba(22,163,74,.10);

  /* job card colors */
  --c1-bg:#dbeafe; --c1-br:#3b82f6; --c1-txt:#1e40af;
  --c2-bg:#dcfce7; --c2-br:#22c55e; --c2-txt:#14532d;
  --c3-bg:#fef3c7; --c3-br:#f59e0b; --c3-txt:#78350f;
  --c4-bg:#fce7f3; --c4-br:#ec4899; --c4-txt:#831843;
  --c5-bg:#ede9fe; --c5-br:#8b5cf6; --c5-txt:#4c1d95;
  --c6-bg:#ffedd5; --c6-br:#f97316; --c6-txt:#7c2d12;

  --label-w:  260px;
  --row-h:    60px;
  --font:     'Inter', system-ui, sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --r:        8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

/* ── App shell ── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Spindrift header bar ── */
.ss-header {
  background: var(--header-grad);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.ss-logo { display: flex; align-items: center; gap: 10px; }
.ss-logo-mark {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,.2);
  border: 1.5px solid rgba(255,255,255,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -.5px;
}
.ss-logo-name { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: -.2px; }
.ss-logo-name span { font-weight: 300; opacity: .75; }
.ss-header-right { display: flex; align-items: center; gap: 10px; }
.ss-module-tag { font-size: 11px; font-weight: 500; color: rgba(255,255,255,.7); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 5px; padding: 3px 10px; }

/* ── Page body ── */
.page { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }

/* ── Control bar ── */
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 14px;
}
.ctrl-group { display: flex; align-items: center; gap: 6px; }
.ctrl-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.ctrl-select {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: var(--font);
  font-size: 12px;
  color: var(--text);
  outline: none;
  cursor: pointer;
  min-width: 130px;
}
.ctrl-select:focus { border-color: var(--accent); }
.ctrl-divider { width: 1px; height: 24px; background: var(--border2); margin: 0 4px; }

.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav button { background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 9px; transition: all .12s; }
.date-nav button:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.date-range-lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 165px; text-align: center; }

.controls-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn-add {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--r);
  font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity .13s, transform .1s;
  white-space: nowrap;
}
.btn-add:hover { opacity: .88; }
.btn-add:active { transform: scale(.97); }

/* ── Stats strip ── */
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 16px;
  flex: 1; min-width: 110px;
  border-left: 3px solid var(--border2);
}
.stat-card.s-done  { border-left-color: var(--done-fg); }
.stat-card.s-prog  { border-left-color: var(--accent); }
.stat-card.s-plan  { border-left-color: var(--plan-fg); }
.stat-card.s-rand  { border-left-color: #7c3aed; }
.stat-card.s-pct   { border-left-color: var(--progress); }
.stat-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.stat-val   { font-size: 19px; font-weight: 700; font-family: var(--mono); margin-top: 3px; color: var(--text); }
.stat-val.done { color: var(--done-fg); }
.stat-val.prog { color: var(--accent); }
.stat-val.plan { color: var(--plan-fg); }
.stat-val.pct  { color: var(--progress); }
.stat-val.rand { color: #7c3aed; font-size: 15px; }

/* ── Board ── */
.board {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
  flex: 1;
}

/* Gantt header */
.gantt-header { display: flex; height: 44px; border-bottom: 1.5px solid var(--border2); background: var(--surface2); position: sticky; top: 0; z-index: 30; }
.header-label-col { width: var(--label-w); min-width: var(--label-w); border-right: 1.5px solid var(--border2); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.header-label-col span { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.header-timeline { flex: 1; display: flex; overflow: hidden; }
.day-hdr { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border); font-size: 9px; color: var(--muted); gap: 1px; }
.day-hdr .dow { font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.day-hdr .dom { font-size: 13px; font-weight: 600; font-family: var(--mono); }
.day-hdr.today { background: var(--accent-dim); }
.day-hdr.today .dom, .day-hdr.today .dow { color: var(--accent); }
.day-hdr.weekend { background: rgba(0,0,0,.02); }

/* Job card group header */
.jobcard-group { }
.jobcard-header {
  display: flex; align-items: center;
  height: 34px;
  background: linear-gradient(90deg, var(--surface3) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  transition: background .12s;
}
.jobcard-header:hover { background: var(--accent-dim); }
.jc-toggle { font-size: 11px; color: var(--muted); transition: transform .15s; }
.jc-toggle.open { transform: rotate(90deg); }
.jc-number { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); }
.jc-site { font-size: 10px; color: var(--muted); }
.jc-badges { display: flex; gap: 5px; margin-left: auto; }
.jc-badge { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; border: 1px solid; }
.jc-badge.done { background: var(--done-bg); color: var(--done-fg); border-color: var(--done-br); }
.jc-badge.prog { background: var(--prog-bg); color: var(--prog-fg); border-color: var(--prog-br); }
.jc-badge.plan { background: var(--plan-bg); color: var(--plan-fg); border-color: var(--plan-br); }
.jc-rand { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.jc-pct-pill { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--progress); background: var(--progress-dim); border-radius: 4px; padding: 1px 6px; }

/* Task rows */
.task-rows { }
.task-row { display: flex; height: var(--row-h); border-bottom: 1px solid var(--border); transition: background .1s; }
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: rgba(37,99,235,.025); }

.task-label {
  width: var(--label-w); min-width: var(--label-w);
  border-right: 1px solid var(--border2);
  padding: 0 14px 0 24px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.task-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.status-badge { font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
.status-badge.done { background: var(--done-bg); color: var(--done-fg); border-color: var(--done-br); }
.status-badge.prog { background: var(--prog-bg); color: var(--prog-fg); border-color: var(--prog-br); }
.status-badge.plan { background: var(--plan-bg); color: var(--plan-fg); border-color: var(--plan-br); }
.status-badge.hold { background: var(--hold-bg); color: var(--hold-fg); border-color: var(--hold-br); }
.task-user { font-size: 10px; color: var(--muted); }
.task-rand-label { font-family: var(--mono); font-size: 9px; color: #7c3aed; }

/* Timeline */
.task-timeline { flex: 1; position: relative; display: flex; align-items: center; overflow: hidden; }
.grid-lines { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 0; }
.grid-line { flex: 1; border-right: 1px solid var(--border); }
.grid-line.weekend { background: rgba(0,0,0,.018); }
.grid-line.today-col { background: var(--accent-dim); border-right-color: rgba(37,99,235,.25); }
.today-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, var(--accent) 70%, transparent); z-index: 10; pointer-events: none; }
.today-marker::before { content:''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }

/* Task bar */
.task-bar {
  position: absolute;
  height: 34px;
  border-radius: 6px;
  border: 1px solid transparent;
  display: flex; align-items: center;
  padding: 0 9px; gap: 6px;
  z-index: 5;
  cursor: grab;
  user-select: none;
  transition: filter .13s, transform .1s, box-shadow .13s;
  overflow: hidden;
  min-width: 4px;
}
.task-bar:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,.12); z-index: 12; }
.task-bar:active { cursor: grabbing; }
.task-bar.dragging { opacity: .75; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.2); transform: translateY(-2px) scale(1.01); transition: none; }

/* Color variants */
.cb-1 { background:var(--c1-bg); border-color:var(--c1-br); color:var(--c1-txt); }
.cb-2 { background:var(--c2-bg); border-color:var(--c2-br); color:var(--c2-txt); }
.cb-3 { background:var(--c3-bg); border-color:var(--c3-br); color:var(--c3-txt); }
.cb-4 { background:var(--c4-bg); border-color:var(--c4-br); color:var(--c4-txt); }
.cb-5 { background:var(--c5-bg); border-color:var(--c5-br); color:var(--c5-txt); }
.cb-6 { background:var(--c6-bg); border-color:var(--c6-br); color:var(--c6-txt); }

.bar-detail { font-size: var(--task-details); }
.bar-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.bar-pct  { font-family: var(--mono); font-size: 9px; opacity: .75; flex-shrink: 0; }
.bar-drag-icon { flex-shrink: 0; font-size: 10px; opacity: .4; margin-left: 2px; }
.bar-rand-tag { font-family: var(--mono); font-size: 9px; opacity: .6; flex-shrink: 0; background: rgba(0,0,0,.06); border-radius: 3px; padding: 0 4px; }

/* Resize handle */
.resize-h { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 8; }
.resize-h::after { content:''; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 2px; height: 12px; border-radius: 1px; background: currentColor; opacity: .3; }

/* Progress line */
.progress-layer { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
.prog-track { position: absolute; top: 50%; transform: translateY(-50%); height: 3px; background: var(--progress-track); border-radius: 2px; }
.prog-fill  { height: 100%; background: var(--progress); border-radius: 2px; box-shadow: 0 0 6px var(--progress-glow); position: relative; }
.prog-head  { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--progress); box-shadow: 0 0 8px var(--progress-glow); }
.prog-lbl   { position: absolute; font-family: var(--mono); font-size: 9px; font-weight: 600; color: var(--progress); white-space: nowrap; z-index: 8; }

/* ── Task form panel ── */
.task-form-row { border-bottom: 1px solid var(--border); }
.task-form-panel {
  display: none;
  background: var(--surface2);
  border-top: 1.5px solid var(--border2);
  padding: 16px 20px 16px 28px;
}
.task-form-panel.open { display: block; }
.form-panel-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field.full { grid-column: 1 / -1; }
.form-field.span2 { grid-column: span 2; }
.form-field label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.form-field input, .form-field select, .form-field textarea {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 5px;
  padding: 6px 9px; font-family: var(--font); font-size: 12px; color: var(--text); outline: none; width: 100%;
  transition: border-color .12s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--accent); }
.form-field textarea { resize: none; height: 52px; }
.rand-inp { font-family: var(--mono); }
.pct-row { display: flex; align-items: center; gap: 8px; }
.pct-row input[type=range] { flex: 1; accent-color: var(--progress); }
.pct-row .pct-val { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--progress); min-width: 38px; text-align: right; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.btn-form-cancel { padding: 6px 14px; background: none; border: 1px solid var(--border2); border-radius: 5px; color: var(--muted); font-family: var(--font); font-size: 11px; cursor: pointer; }
.btn-form-cancel:hover { border-color: var(--text); color: var(--text); }
.btn-form-save { padding: 6px 16px; background: var(--accent); border: none; border-radius: 5px; color: #fff; font-family: var(--font); font-size: 11px; font-weight: 600; cursor: pointer; }
.btn-form-save:hover { opacity: .87; }

/* ── Add job card modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,30,60,.45); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; width: 520px; max-width: calc(100vw - 24px); padding: 22px; transform: translateY(10px); transition: transform .18s; max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 16px 48px rgba(15,30,60,.18); }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.m-field { display: flex; flex-direction: column; gap: 4px; }
.m-field.full { grid-column: 1/-1; }
.m-field label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.m-field input, .m-field select, .m-field textarea { background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 8px 10px; font-family: var(--font); font-size: 13px; color: var(--text); outline: none; width: 100%; }
.m-field input:focus, .m-field select:focus { border-color: var(--accent); }
.m-field select option { background: #fff; }
.color-picker-row { display: flex; gap: 8px; margin-top: 3px; }
.csw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .1s, border-color .12s; }
.csw:hover { transform: scale(1.1); }
.csw.sel { border-color: var(--text); }
.csw-1{background:var(--c1-br);} .csw-2{background:var(--c2-br);} .csw-3{background:var(--c3-br);}
.csw-4{background:var(--c4-br);} .csw-5{background:var(--c5-br);} .csw-6{background:var(--c6-br);}
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.btn-mcancel { padding: 8px 16px; background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--muted); font-family: var(--font); font-size: 12px; cursor: pointer; }
.btn-msave { padding: 8px 18px; background: var(--accent); border: none; border-radius: 6px; color: #fff; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-msave:hover { opacity: .87; }

/* ── Tooltip ── */
.tooltip { position: fixed; background: #fff; border: 1px solid var(--border2); border-radius: 8px; padding: 11px 14px; font-size: 11px; color: var(--text); z-index: 900; pointer-events: none; max-width: 300px; box-shadow: 0 8px 28px rgba(15,30,60,.14); opacity: 0; transition: opacity .1s; }
.tooltip.visible { opacity: 1; }
.tt-title { font-weight: 700; font-size: 12px; margin-bottom: 6px; color: var(--text); }
.tt-row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
.tt-key { color: var(--muted); font-size: 10px; }
.tt-val { font-family: var(--mono); font-size: 10px; color: var(--text); font-weight: 500; }
.tt-sep { border-top: 1px solid var(--border); margin: 6px 0; }
.tt-note { font-size: 10px; color: var(--muted); font-style: italic; margin-top: 4px; }
.tt-pct-bar { height: 4px; background: var(--progress-track); border-radius: 2px; margin-top: 4px; }
.tt-pct-fill { height: 100%; background: var(--progress); border-radius: 2px; }

/* ── Save flash ── */
.save-flash { position: fixed; bottom: 18px; right: 18px; background: #f0fdf4; border: 1px solid var(--done-br); color: var(--done-fg); border-radius: 7px; padding: 10px 16px; font-size: 12px; font-weight: 600; z-index: 600; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; pointer-events: none; display: flex; align-items: center; gap: 6px; }
.save-flash.show { opacity: 1; transform: translateY(0); }

/* empty */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 120px; color: var(--muted); font-size: 13px; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">

  <!-- Spindrift header -->
  <div class="ss-header">
    <div class="ss-logo">
      <div class="ss-logo-mark">SS</div>
      <div class="ss-logo-name">Spindrift <span>Solutions</span></div>
    </div>
    <div class="ss-header-right">
      <span class="ss-module-tag">Gantt Chart Sample</span>
    </div>
  </div>

  <div class="page">

    <!-- Controls -->
    <div class="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">Site</span>
        <select class="ctrl-select" id="filter-site">
          <option value="">All sites</option>
        </select>
      </div>
      <div class="ctrl-divider"></div>
      <div class="ctrl-group">
        <span class="ctrl-label">Status</span>
        <select class="ctrl-select" id="filter-status">
          <option value="">All statuses</option>
          <option value="In Progress">In Progress</option>
          <option value="Planned">Planned</option>
          <option value="Done">Done</option>
          <option value="On Hold">On Hold</option>
        </select>
      </div>
      <div class="ctrl-divider"></div>
      <div class="date-nav">
        <button id="btn-prev">‹</button>
        <span class="date-range-lbl" id="date-range-lbl">—</span>
        <button id="btn-next">›</button>
      </div>
      <div class="controls-right">
        <button class="btn-add" id="btn-open-modal">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><line x1="5.5" y1="1" x2="5.5" y2="10" stroke="white" stroke-width="1.8" stroke-linecap="round"/><line x1="1" y1="5.5" x2="10" y2="5.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add task
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Total tasks</div><div class="stat-val" id="s-total">0</div></div>
      <div class="stat-card s-done"><div class="stat-label">Done</div><div class="stat-val done" id="s-done">0</div></div>
      <div class="stat-card s-prog"><div class="stat-label">In progress</div><div class="stat-val prog" id="s-prog">0</div></div>
      <div class="stat-card s-plan"><div class="stat-label">Planned</div><div class="stat-val plan" id="s-plan">0</div></div>
      <div class="stat-card s-rand"><div class="stat-label">Total Rand value</div><div class="stat-val rand" id="s-rand">R0</div></div>
      <div class="stat-card s-pct"><div class="stat-label">Avg progress</div><div class="stat-val pct" id="s-avg">0%</div></div>
    </div>

    <!-- Gantt board -->
    <div class="board">
      <div class="gantt-header">
        <div class="header-label-col">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="opacity:.4;flex-shrink:0"><rect x=".5" y=".5" width="11" height="11" rx="2" stroke="currentColor"/><line x1="4" y1=".5" x2="4" y2="11.5" stroke="currentColor"/></svg>
          <span>Jobcard / Task</span>
        </div>
        <div class="header-timeline" id="day-headers"></div>
      </div>
      <div id="gantt-body"></div>
    </div>

  </div><!-- .page -->
</div><!-- .app -->

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- Save flash -->
<div class="save-flash" id="save-flash">
  <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="6" stroke="var(--done-fg)" stroke-width="1"/><path d="M3.5 6.5L5.5 8.5L9.5 4.5" stroke="var(--done-fg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Saved to Zoho Creator
</div>

<!-- Add task modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x=".5" y=".5" width="15" height="15" rx="3.5" stroke="var(--accent)" stroke-width="1.5"/><line x1="8" y1="4" x2="8" y2="12" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="8" x2="12" y2="8" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span id="modal-title-text">Add new task</span>
    </div>
    <div class="modal-grid">
      <div class="m-field full"><label>Task title / name</label><input type="text" id="m-name" placeholder="e.g. Foundation excavation"></div>
      <div class="m-field"><label>Jobcard No</label>
        <select id="m-jobcard"><option value="new">+ New jobcard</option></select>
      </div>
      <div class="m-field"><label>New jobcard No (if new)</label><input type="text" id="m-newjc" placeholder="e.g. JC-2025-041"></div>
      <div class="m-field"><label>Task Details</label>
        <select id="m-details">
          <option value="">— select —</option>
          <option>Earthworks</option><option>Concrete</option><option>Steelwork</option>
          <option>Electrical</option><option>Plumbing</option><option>Finishes</option>
          <option>Inspection</option><option>Handover</option>
        </select>
      </div>
      <div class="m-field"><label>Building Site</label>
        <select id="m-site"><option value="">— select —</option></select>
      </div>
      <div class="m-field"><label>Start date</label><input type="date" id="m-start"></div>
      <div class="m-field"><label>End date</label><input type="date" id="m-end"></div>
      <div class="m-field"><label>Task Status</label>
        <select id="m-status">
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
          <option value="On Hold">On Hold</option>
        </select>
      </div>
      <div class="m-field"><label>Estimated completion date</label><input type="date" id="m-est-end"></div>
      <div class="m-field"><label>Task Rand Value (R)</label><input type="number" id="m-rand" placeholder="0.00" step="0.01" min="0" class="rand-inp"></div>
      <div class="m-field"><label>Task Status User</label><input type="text" id="m-user" placeholder="e.g. John Smith"></div>
      <div class="m-field full"><label>Task Status Note</label><textarea id="m-note" placeholder="Any notes or remarks..."></textarea></div>
      <div class="m-field full"><label>Bar colour</label>
        <div class="color-picker-row" id="modal-color-picker">
          <div class="csw csw-1 sel" data-c="1" title="Blue"></div>
          <div class="csw csw-2" data-c="2" title="Green"></div>
          <div class="csw csw-3" data-c="3" title="Amber"></div>
          <div class="csw csw-4" data-c="4" title="Pink"></div>
          <div class="csw csw-5" data-c="5" title="Purple"></div>
          <div class="csw csw-6" data-c="6" title="Orange"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-mcancel" id="btn-mcancel">Cancel</button>
      <button class="btn-msave" id="btn-msave">Save task</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ZOHO CONFIG — mapped to your Spindrift Solutions form
   ═══════════════════════════════════════════════════════════ */
const ZOHO_CONFIG = {
  appName:    'spindrift_solutions',    // ← your app link name
  reportName: 'All_Gannt_Chart_Samples',// ← your report name
  formName:   'Gannt_Chart_Sample',     // ← your form name

  fields: {
    id:               'ID',
    taskTitle:        'Task_Title_name',
    jobcardNo:        'Jobcard_No',
    taskStatus:       'Task_Status',
    estCompDate:      'Task_Estimated_Completion_Date',
    taskRandValue:    'Task_Rand_Value',
    startDate:        'Date_Time_Start_date',
    endDate:          'Date_Time_End_date',
    taskDetails:      'Task_Details',
    statusTimestamp:  'Task_Status_Time_Stamp',
    progressPct:      'Task_Progress_Completed',
    completionRand:   'Task_Completion_Rand_Value',
    randOS:           'Task_Rand_Value_O_S',
    buildingSites:    'Building_Sites',
    statusUser:       'Task_Status_User',
    statusNote:       'Task_Status_Note',
  }
};

/* ═══════════════════════════════════════════════════════════
   DEMO DATA  (mirrors your form structure)
   ═══════════════════════════════════════════════════════════ */
function daysFromNow(n){ const d=new Date(); d.setDate(d.getDate()+n); d.setHours(0,0,0,0); return d; }
const DEMO_TASKS = [
  { id:'1', taskTitle:'Site clearing & peg out',   jobcardNo:'JC-2025-031', taskStatus:'Done',        startDate:daysFromNow(-6), endDate:daysFromNow(-3), taskDetails:'Earthworks',  buildingSites:'Stellenbosch Phase 1', statusUser:'A. van der Berg', taskRandValue:42000,   progressPct:100, statusNote:'Completed on schedule', color:1 },
  { id:'2', taskTitle:'Bulk earthworks',            jobcardNo:'JC-2025-031', taskStatus:'Done',        startDate:daysFromNow(-3), endDate:daysFromNow(0),  taskDetails:'Earthworks',  buildingSites:'Stellenbosch Phase 1', statusUser:'A. van der Berg', taskRandValue:185000,  progressPct:100, statusNote:'', color:1 },
  { id:'3', taskTitle:'Foundation excavation',      jobcardNo:'JC-2025-031', taskStatus:'In Progress', startDate:daysFromNow(0),  endDate:daysFromNow(4),  taskDetails:'Concrete',    buildingSites:'Stellenbosch Phase 1', statusUser:'B. Joubert',      taskRandValue:97000,   progressPct:40,  statusNote:'Soft spots found in NW corner – awaiting geotech', color:1 },
  { id:'4', taskTitle:'Strip footings & blinding',  jobcardNo:'JC-2025-031', taskStatus:'Planned',     startDate:daysFromNow(4),  endDate:daysFromNow(7),  taskDetails:'Concrete',    buildingSites:'Stellenbosch Phase 1', statusUser:'',                taskRandValue:63000,   progressPct:0,   statusNote:'', color:1 },
  { id:'5', taskTitle:'Rebar schedule – columns',   jobcardNo:'JC-2025-032', taskStatus:'In Progress', startDate:daysFromNow(-2), endDate:daysFromNow(3),  taskDetails:'Steelwork',   buildingSites:'Paarl Commercial',    statusUser:'C. Fortuin',      taskRandValue:210000,  progressPct:65,  statusNote:'', color:2 },
  { id:'6', taskTitle:'Shutter & pour columns',     jobcardNo:'JC-2025-032', taskStatus:'Planned',     startDate:daysFromNow(3),  endDate:daysFromNow(8),  taskDetails:'Concrete',    buildingSites:'Paarl Commercial',    statusUser:'',                taskRandValue:158000,  progressPct:0,   statusNote:'', color:2 },
  { id:'7', taskTitle:'Electrical first fix',       jobcardNo:'JC-2025-032', taskStatus:'Planned',     startDate:daysFromNow(6),  endDate:daysFromNow(11), taskDetails:'Electrical',  buildingSites:'Paarl Commercial',    statusUser:'',                taskRandValue:74000,   progressPct:0,   statusNote:'', color:2 },
  { id:'8', taskTitle:'Waterproofing – basement',   jobcardNo:'JC-2025-033', taskStatus:'On Hold',     startDate:daysFromNow(1),  endDate:daysFromNow(5),  taskDetails:'Finishes',    buildingSites:'Somerset West Res',   statusUser:'D. Hendricks',    taskRandValue:55000,   progressPct:10,  statusNote:'Supplier delivery delayed – ETA +5 days', color:3 },
  { id:'9', taskTitle:'Plumbing rough-in',          jobcardNo:'JC-2025-033', taskStatus:'Planned',     startDate:daysFromNow(5),  endDate:daysFromNow(10), taskDetails:'Plumbing',    buildingSites:'Somerset West Res',   statusUser:'',                taskRandValue:89000,   progressPct:0,   statusNote:'', color:3 },
  { id:'10',taskTitle:'Council inspection',         jobcardNo:'JC-2025-033', taskStatus:'Planned',     startDate:daysFromNow(10), endDate:daysFromNow(11), taskDetails:'Inspection',  buildingSites:'Somerset West Res',   statusUser:'',                taskRandValue:0,       progressPct:0,   statusNote:'', color:3 },
];

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const DAYS = 14;
let viewStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-4); return d; })();
let tasks = [];
let nextId = 2000;
let openRows = new Set();    // task ids with form panel open
let zohoReady = false;
let flashTimer;
let selColor = 1;
let filterSite = '';
let filterStatus = '';
let knownSites = new Set();
let knownJobcards = new Set();

/* ═══════════════════════════════════════════════════════════
   ZOHO BRIDGE
   ═══════════════════════════════════════════════════════════ */
function tryZohoInit(){
  if(typeof ZOHO==='undefined'||!ZOHO.CREATOR){
    tasks=DEMO_TASKS.map(t=>({...t}));
    boot(); return;
  }
  ZOHO.CREATOR.init().then(()=>{ zohoReady=true; loadFromZoho(); }).catch(()=>{ tasks=DEMO_TASKS.map(t=>({...t})); boot(); });
}
function loadFromZoho(){
  ZOHO.CREATOR.DATA.getRecords({ appName:ZOHO_CONFIG.appName, reportName:ZOHO_CONFIG.reportName, page:1, pageSize:500 })
    .then(r=>{ if(r&&r.data){ tasks=r.data.map(zohoToTask); } boot(); });
}
function zohoToTask(rec){
  const f=ZOHO_CONFIG.fields;
  return {
    id:            String(rec[f.id]),
    taskTitle:     rec[f.taskTitle]||'Untitled',
    jobcardNo:     rec[f.jobcardNo]||'—',
    taskStatus:    rec[f.taskStatus]||'Planned',
    estCompDate:   rec[f.estCompDate]||'',
    taskRandValue: parseFloat(rec[f.taskRandValue])||0,
    startDate:     new Date(rec[f.startDate]),
    endDate:       new Date(rec[f.endDate]),
    taskDetails:   rec[f.taskDetails]||'',
    statusTimestamp:rec[f.statusTimestamp]||'',
    progressPct:   parseFloat(rec[f.progressPct])||0,
    completionRand:parseFloat(rec[f.completionRand])||0,
    randOS:        parseFloat(rec[f.randOS])||0,
    buildingSites: rec[f.buildingSites]||'',
    statusUser:    rec[f.statusUser]||'',
    statusNote:    rec[f.statusNote]||'',
    color:         parseInt(rec['Color_Tag'])||1,
    zohoId:        rec[f.id],
  };
}
function taskToZoho(t){
  const f=ZOHO_CONFIG.fields;
  return {
    [f.taskTitle]:    t.taskTitle,
    [f.jobcardNo]:    t.jobcardNo,
    [f.taskStatus]:   t.taskStatus,
    [f.taskRandValue]:String(t.taskRandValue),
    [f.startDate]:    fmtDate(t.startDate),
    [f.endDate]:      fmtDate(t.endDate),
    [f.taskDetails]:  t.taskDetails,
    [f.progressPct]:  String(t.progressPct),
    [f.buildingSites]:t.buildingSites,
    [f.statusUser]:   t.statusUser,
    [f.statusNote]:   t.statusNote,
    'Color_Tag':      String(t.color),
  };
}
function persistUpdate(t){
  if(!zohoReady||!t.zohoId){ flashSave(); return; }
  ZOHO.CREATOR.DATA.updateRecord({ appName:ZOHO_CONFIG.appName, reportName:ZOHO_CONFIG.reportName, id:t.zohoId, data:taskToZoho(t) }).then(flashSave).catch(console.error);
}
function persistNew(t){
  if(!zohoReady){ flashSave(); return; }
  ZOHO.CREATOR.DATA.addRecord({ appName:ZOHO_CONFIG.appName, formName:ZOHO_CONFIG.formName, data:taskToZoho(t) })
    .then(r=>{ if(r?.data?.ID) t.zohoId=r.data.ID; flashSave(); }).catch(console.error);
}
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toISOString().slice(0,10); }
function fmtDisp(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}); }

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
function boot(){
  buildFilterOptions();
  render();
}
function buildFilterOptions(){
  tasks.forEach(t=>{ if(t.buildingSites) knownSites.add(t.buildingSites); if(t.jobcardNo) knownJobcards.add(t.jobcardNo); });
  const siteEl=document.getElementById('filter-site');
  siteEl.innerHTML='<option value="">All sites</option>'+[...knownSites].sort().map(s=>`<option>${esc(s)}</option>`).join('');
  rebuildJobcardDropdown();
}
function rebuildJobcardDropdown(){
  const el=document.getElementById('m-jobcard');
  el.innerHTML='<option value="new">+ New jobcard</option>'+[...knownJobcards].sort().map(j=>`<option value="${esc(j)}">${esc(j)}</option>`).join('');
  const siteEl=document.getElementById('m-site');
  siteEl.innerHTML='<option value="">— select —</option>'+[...knownSites].sort().map(s=>`<option>${esc(s)}</option>`).join('');
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function render(){ renderHeaders(); renderBody(); renderStats(); }

function renderHeaders(){
  const c=document.getElementById('day-headers'); c.innerHTML='';
  const today=new Date(); today.setHours(0,0,0,0);
  const endDate=new Date(viewStart); endDate.setDate(viewStart.getDate()+DAYS-1);
  document.getElementById('date-range-lbl').textContent=
    viewStart.toLocaleDateString('en-ZA',{day:'numeric',month:'short'})+' – '+
    endDate.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'2-digit'});
  for(let i=0;i<DAYS;i++){
    const d=new Date(viewStart); d.setDate(viewStart.getDate()+i);
    const isToday=d.getTime()===today.getTime();
    const isWe=d.getDay()===0||d.getDay()===6;
    const el=document.createElement('div');
    el.className='day-hdr'+(isToday?' today':'')+(isWe?' weekend':'');
    el.innerHTML=`<span class="dow">${d.toLocaleDateString('en-ZA',{weekday:'short'})}</span><span class="dom">${d.getDate()}</span>`;
    c.appendChild(el);
  }
}

function filteredTasks(){
  return tasks.filter(t=>{
    if(filterSite   && t.buildingSites!==filterSite)  return false;
    if(filterStatus && t.taskStatus!==filterStatus)   return false;
    return true;
  });
}

function renderBody(){
  const body=document.getElementById('gantt-body'); body.innerHTML='';
  const ft=filteredTasks();
  if(!ft.length){ body.innerHTML='<div class="empty-state">📋 No tasks match the current filter</div>'; return; }

  // group by jobcard
  const groups={};
  ft.forEach(t=>{ if(!groups[t.jobcardNo]) groups[t.jobcardNo]=[]; groups[t.jobcardNo].push(t); });

  const today=new Date(); today.setHours(0,0,0,0);
  const todayOff=Math.round((today-viewStart)/864e5);
  const colorClasses=['','cb-1','cb-2','cb-3','cb-4','cb-5','cb-6'];

  Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).forEach(([jcNo, jtasks])=>{
    const grp=document.createElement('div');
    grp.className='jobcard-group';

    // jobcard header
    const jcOpen=!openRows.has('jc-'+jcNo); // jobcard groups default open
    const site=jtasks[0].buildingSites||'';
    const avgPct=Math.round(jtasks.reduce((s,t)=>s+t.progressPct,0)/jtasks.length);
    const done=jtasks.filter(t=>t.taskStatus==='Done').length;
    const prog=jtasks.filter(t=>t.taskStatus==='In Progress').length;
    const rand=jtasks.reduce((s,t)=>s+t.taskRandValue,0);

    const jcHdr=document.createElement('div');
    jcHdr.className='jobcard-header';
    jcHdr.innerHTML=`
      <span class="jc-toggle${jcOpen?'':' open'}">›</span>
      <span class="jc-number">${esc(jcNo)}</span>
      <span class="jc-site">${esc(site)}</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        ${done?`<span class="jc-badge done">${done} done</span>`:''}
        ${prog?`<span class="jc-badge prog">${prog} active</span>`:''}
        <span class="jc-rand">R ${formatRand(rand)}</span>
        <span class="jc-pct-pill">${avgPct}%</span>
      </span>`;
    jcHdr.addEventListener('click',()=>{ if(openRows.has('jc-'+jcNo)) openRows.delete('jc-'+jcNo); else openRows.add('jc-'+jcNo); render(); });
    grp.appendChild(jcHdr);

    if(!openRows.has('jc-'+jcNo)){
      const tRows=document.createElement('div');
      tRows.className='task-rows';

      jtasks.forEach(task=>{
        const wrap=document.createElement('div');
        wrap.className='task-form-row';

        /* gantt row */
        const row=document.createElement('div');
        row.className='task-row';

        /* label */
        const lbl=document.createElement('div');
        lbl.className='task-label';
        const sc=statusCode(task.taskStatus);
        lbl.innerHTML=`
          <span class="task-name">${esc(task.taskTitle)}</span>
          <div class="task-meta">
            <span class="status-badge ${sc}">${esc(task.taskStatus)}</span>
            ${task.taskDetails?`<span style="font-size:9px;color:var(--muted)">${esc(task.taskDetails)}</span>`:''}
          </div>
          <div class="task-meta">
            ${task.statusUser?`<span class="task-user">${esc(task.statusUser)}</span>`:''}
            ${task.taskRandValue?`<span class="task-rand-label">R ${formatRand(task.taskRandValue)}</span>`:''}
          </div>`;
        // click label to open form panel
        lbl.style.cursor='pointer';
        lbl.addEventListener('click',()=>{
          if(openRows.has(task.id)) openRows.delete(task.id); else openRows.add(task.id);
          render();
        });
        row.appendChild(lbl);

        /* timeline */
        const tl=document.createElement('div');
        tl.className='task-timeline';

        // grid lines
        const gl=document.createElement('div'); gl.className='grid-lines';
        for(let i=0;i<DAYS;i++){
          const d=new Date(viewStart); d.setDate(viewStart.getDate()+i);
          const isWe=d.getDay()===0||d.getDay()===6;
          const g=document.createElement('div');
          g.className='grid-line'+(isWe?' weekend':'')+(i===todayOff?' today-col':'');
          gl.appendChild(g);
        }
        tl.appendChild(gl);

        // today marker
        if(todayOff>=0&&todayOff<DAYS){
          const tm=document.createElement('div'); tm.className='today-marker';
          tm.style.left=((todayOff+.5)/DAYS*100)+'%'; tl.appendChild(tm);
        }

        // calculate bar position from start/end dates
        const sd=new Date(task.startDate); sd.setHours(0,0,0,0);
        const ed=new Date(task.endDate);   ed.setHours(0,0,0,0);
        const startOff=Math.round((sd-viewStart)/864e5);
        const endOff  =Math.round((ed-viewStart)/864e5)+1; // inclusive
        const durDays =Math.max(1, endOff-startOff);

        const cL=Math.max(0,startOff);
        const cR=Math.min(DAYS,endOff);

        if(cR>cL){
          // task bar
          const bar=document.createElement('div');
          bar.className=`task-bar ${colorClasses[task.color]||'cb-1'}`;
          bar.style.left  =(cL/DAYS*100).toFixed(3)+'%';
          bar.style.width =((cR-cL)/DAYS*100).toFixed(3)+'%';
          bar.innerHTML=`
            <span class="bar-name">${esc(task.taskTitle)}</span>
            ${task.taskDetails?`<span class="bar-rand-tag">${esc(task.taskDetails)}</span>`:''}
            <span class="bar-pct">${task.progressPct}%</span>
            <span class="bar-drag-icon">⠿</span>`;

          // tooltip
          bar.addEventListener('mouseenter',e=>showTooltip(e,task,sd,ed,durDays));
          bar.addEventListener('mousemove',moveTooltip);
          bar.addEventListener('mouseleave',hideTooltip);

          // drag to reschedule
          attachDrag(bar,tl,task,durDays);

          // resize right edge
          const rh=document.createElement('div'); rh.className='resize-h';
          bar.appendChild(rh);
          attachResize(rh,tl,task);

          tl.appendChild(bar);

          // progress line
          if(task.progressPct>0){
            const progLayer=document.createElement('div'); progLayer.className='progress-layer';
            const trackL=cL/DAYS*100;
            const trackW=(cR-cL)/DAYS*100;
            const track=document.createElement('div'); track.className='prog-track';
            track.style.cssText=`left:${trackL.toFixed(3)}%;width:${trackW.toFixed(3)}%;`;
            const fillW=(task.progressPct/100*100).toFixed(2)+'%';
            const fill=document.createElement('div'); fill.className='prog-fill';
            fill.style.width=fillW;
            if(task.progressPct<100){
              const head=document.createElement('div'); head.className='prog-head'; fill.appendChild(head);
            }
            track.appendChild(fill);
            progLayer.appendChild(track);

            // pct label
            const plbl=document.createElement('div'); plbl.className='prog-lbl';
            const headX=trackL+(trackW*task.progressPct/100);
            plbl.style.cssText=`left:${Math.min(headX+1,trackL+trackW-8).toFixed(2)}%;bottom:8px;`;
            plbl.textContent=task.progressPct+'%';
            progLayer.appendChild(plbl);
            tl.appendChild(progLayer);
          }
        }

        row.appendChild(tl);
        wrap.appendChild(row);

        /* inline task form panel */
        if(openRows.has(task.id)){
          const panel=document.createElement('div');
          panel.className='task-form-panel open';
          panel.innerHTML=buildTaskForm(task);
          wrap.appendChild(panel);
          wireTaskForm(panel,task);
        }

        tRows.appendChild(wrap);
      });

      grp.appendChild(tRows);
    }

    body.appendChild(grp);
  });
}

function renderStats(){
  const ft=filteredTasks();
  document.getElementById('s-total').textContent=ft.length;
  document.getElementById('s-done').textContent =ft.filter(t=>t.taskStatus==='Done').length;
  document.getElementById('s-prog').textContent =ft.filter(t=>t.taskStatus==='In Progress').length;
  document.getElementById('s-plan').textContent =ft.filter(t=>t.taskStatus==='Planned').length;
  const totalRand=ft.reduce((s,t)=>s+t.taskRandValue,0);
  document.getElementById('s-rand').textContent='R '+formatRand(totalRand);
  const avg=ft.length?Math.round(ft.reduce((s,t)=>s+t.progressPct,0)/ft.length):0;
  document.getElementById('s-avg').textContent=avg+'%';
}

/* ═══════════════════════════════════════════════════════════
   INLINE TASK FORM
   ═══════════════════════════════════════════════════════════ */
function buildTaskForm(t){
  const jcOpts=knownJobcards.has(t.jobcardNo)
    ?[...knownJobcards].sort().map(j=>`<option${j===t.jobcardNo?' selected':''}>${esc(j)}</option>`).join('')
    :`<option selected>${esc(t.jobcardNo)}</option>`;
  const siteOpts=[...knownSites].sort().map(s=>`<option${s===t.buildingSites?' selected':''}>${esc(s)}</option>`).join('');
  const detailsOpts=['','Earthworks','Concrete','Steelwork','Electrical','Plumbing','Finishes','Inspection','Handover']
    .map(d=>`<option${d===t.taskDetails?' selected':''}>${esc(d)}</option>`).join('');
  const statusOpts=['Planned','In Progress','Done','On Hold'].map(s=>`<option${s===t.taskStatus?' selected':''}>${esc(s)}</option>`).join('');

  return `
    <div class="form-panel-title">
      <span>Edit task — ${esc(t.taskTitle)}</span>
      <span style="font-size:10px;font-family:var(--mono);color:var(--muted)">${esc(t.jobcardNo)}</span>
    </div>
    <div class="form-grid">
      <div class="form-field span2"><label>Task title / name</label><input class="fp-name" type="text" value="${esc(t.taskTitle)}"></div>
      <div class="form-field"><label>Task status</label><select class="fp-status">${statusOpts}</select></div>
      <div class="form-field"><label>Jobcard No</label><select class="fp-jc">${jcOpts}</select></div>
      <div class="form-field"><label>Task Details</label><select class="fp-details">${detailsOpts}</select></div>
      <div class="form-field"><label>Building Site</label><select class="fp-site"><option value="">—</option>${siteOpts}</select></div>
      <div class="form-field"><label>Start date</label><input class="fp-start" type="date" value="${fmtDate(t.startDate)}"></div>
      <div class="form-field"><label>End date</label><input class="fp-end" type="date" value="${fmtDate(t.endDate)}"></div>
      <div class="form-field"><label>Est. completion date</label><input class="fp-est" type="date" value="${fmtDate(t.estCompDate)}"></div>
      <div class="form-field"><label>Task Rand Value (R)</label><input class="fp-rand rand-inp" type="number" value="${t.taskRandValue}" step="0.01" min="0"></div>
      <div class="form-field"><label>Completion Rand Value (R)</label><input class="fp-crand rand-inp" type="number" value="${t.completionRand||''}" step="0.01" min="0"></div>
      <div class="form-field"><label>Rand Value O/S (R)</label><input class="fp-oos rand-inp" type="number" value="${t.randOS||''}" step="0.01" min="0"></div>
      <div class="form-field"><label>Status user</label><input class="fp-user" type="text" value="${esc(t.statusUser)}"></div>
      <div class="form-field full">
        <label>Progress completed — <span class="fp-pct-lbl" style="color:var(--progress);font-family:var(--mono)">${t.progressPct}%</span></label>
        <div class="pct-row">
          <input class="fp-pct" type="range" min="0" max="100" step="5" value="${t.progressPct}">
          <span class="pct-val fp-pct-display">${t.progressPct}%</span>
        </div>
      </div>
      <div class="form-field full"><label>Task Status Note</label><textarea class="fp-note">${esc(t.statusNote)}</textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn-form-cancel fp-cancel">Close</button>
      <button class="btn-form-save fp-save">Save to Zoho</button>
    </div>`;
}

function wireTaskForm(panel,task){
  const get=cls=>panel.querySelector(cls);
  const pctSlider=get('.fp-pct');
  const pctDisp=get('.fp-pct-display');
  const pctLbl=get('.fp-pct-lbl');
  pctSlider.addEventListener('input',()=>{
    const v=parseInt(pctSlider.value);
    pctDisp.textContent=v+'%';
    pctLbl.textContent=v+'%';
    task.progressPct=v;
  });
  get('.fp-cancel').addEventListener('click',()=>{ openRows.delete(task.id); render(); });
  get('.fp-save').addEventListener('click',()=>{
    task.taskTitle   =get('.fp-name').value.trim()||task.taskTitle;
    task.taskStatus  =get('.fp-status').value;
    task.jobcardNo   =get('.fp-jc').value;
    task.taskDetails =get('.fp-details').value;
    task.buildingSites=get('.fp-site').value;
    task.startDate   =new Date(get('.fp-start').value);
    task.endDate     =new Date(get('.fp-end').value);
    task.estCompDate =get('.fp-est').value;
    task.taskRandValue=parseFloat(get('.fp-rand').value)||0;
    task.completionRand=parseFloat(get('.fp-crand').value)||0;
    task.randOS      =parseFloat(get('.fp-oos').value)||0;
    task.statusUser  =get('.fp-user').value;
    task.statusNote  =get('.fp-note').value;
    task.progressPct =parseInt(pctSlider.value)||0;
    if(task.buildingSites) knownSites.add(task.buildingSites);
    persistUpdate(task);
    openRows.delete(task.id);
    render();
  });
}

/* ═══════════════════════════════════════════════════════════
   DRAG & RESIZE
   ═══════════════════════════════════════════════════════════ */
function attachDrag(bar,tl,task,durDays){
  bar.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('resize-h')) return;
    e.preventDefault();
    const tlR=tl.getBoundingClientRect();
    const dayPx=tlR.width/DAYS;
    const origStart=new Date(task.startDate); origStart.setHours(0,0,0,0);
    const sx=e.clientX;
    bar.classList.add('dragging');
    const move=ev=>{
      const delta=Math.round((ev.clientX-sx)/dayPx);
      const ns=new Date(origStart); ns.setDate(origStart.getDate()+delta);
      const ne=new Date(ns); ne.setDate(ns.getDate()+durDays-1);
      const off=Math.round((ns-viewStart)/864e5);
      const clampL=Math.max(0,off);
      bar.style.left=(clampL/DAYS*100)+'%';
      task._dragDate=ns; task._dragEnd=ne;
    };
    const up=()=>{
      bar.classList.remove('dragging');
      if(task._dragDate){ task.startDate=task._dragDate; task.endDate=task._dragEnd; delete task._dragDate; delete task._dragEnd; persistUpdate(task); render(); }
      document.removeEventListener('mousemove',move);
      document.removeEventListener('mouseup',up);
    };
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
  });
}
function attachResize(handle,tl,task){
  handle.addEventListener('mousedown',e=>{
    e.preventDefault(); e.stopPropagation();
    const tlR=tl.getBoundingClientRect();
    const dayPx=tlR.width/DAYS;
    const origEnd=new Date(task.endDate); origEnd.setHours(0,0,0,0);
    const sx=e.clientX;
    const bar=handle.parentElement;
    const move=ev=>{
      const delta=Math.round((ev.clientX-sx)/dayPx);
      const ne=new Date(origEnd); ne.setDate(origEnd.getDate()+delta);
      if(ne<=new Date(task.startDate)) return;
      const startOff=Math.round((new Date(task.startDate)-viewStart)/864e5);
      const endOff  =Math.round((ne-viewStart)/864e5)+1;
      bar.style.width=((Math.min(DAYS,endOff)-Math.max(0,startOff))/DAYS*100)+'%';
      task._resizeEnd=ne;
    };
    const up=()=>{
      if(task._resizeEnd){ task.endDate=task._resizeEnd; delete task._resizeEnd; persistUpdate(task); render(); }
      document.removeEventListener('mousemove',move);
      document.removeEventListener('mouseup',up);
    };
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
  });
}

/* ═══════════════════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════════════════ */
const ttEl=document.getElementById('tooltip');
function showTooltip(e,t,sd,ed,dur){
  ttEl.innerHTML=`
    <div class="tt-title">${esc(t.taskTitle)}</div>
    <div class="tt-row"><span class="tt-key">Jobcard</span><span class="tt-val">${esc(t.jobcardNo)}</span></div>
    <div class="tt-row"><span class="tt-key">Site</span><span class="tt-val">${esc(t.buildingSites)||'—'}</span></div>
    <div class="tt-row"><span class="tt-key">Type</span><span class="tt-val">${esc(t.taskDetails)||'—'}</span></div>
    <div class="tt-sep"></div>
    <div class="tt-row"><span class="tt-key">Start</span><span class="tt-val">${fmtDisp(sd)}</span></div>
    <div class="tt-row"><span class="tt-key">End</span><span class="tt-val">${fmtDisp(ed)}</span></div>
    <div class="tt-row"><span class="tt-key">Duration</span><span class="tt-val">${dur}d</span></div>
    <div class="tt-sep"></div>
    <div class="tt-row"><span class="tt-key">Rand value</span><span class="tt-val">R ${formatRand(t.taskRandValue)}</span></div>
    ${t.completionRand?`<div class="tt-row"><span class="tt-key">At completion</span><span class="tt-val">R ${formatRand(t.completionRand)}</span></div>`:''}
    ${t.randOS?`<div class="tt-row"><span class="tt-key">Outstanding</span><span class="tt-val">R ${formatRand(t.randOS)}</span></div>`:''}
    <div class="tt-sep"></div>
    <div class="tt-row"><span class="tt-key">Progress</span><span class="tt-val">${t.progressPct}%</span></div>
    <div class="tt-pct-bar"><div class="tt-pct-fill" style="width:${t.progressPct}%"></div></div>
    ${t.statusUser?`<div class="tt-row" style="margin-top:5px"><span class="tt-key">User</span><span class="tt-val">${esc(t.statusUser)}</span></div>`:''}
    ${t.statusNote?`<div class="tt-note">${esc(t.statusNote)}</div>`:''}`;
  ttEl.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e){ const w=ttEl.offsetWidth,h=ttEl.offsetHeight; ttEl.style.left=Math.min(e.clientX+14,window.innerWidth-w-8)+'px'; ttEl.style.top=Math.min(e.clientY-10,window.innerHeight-h-8)+'px'; }
function hideTooltip(){ ttEl.classList.remove('visible'); }

document.getElementById('btn-msave').addEventListener('click',()=>{
  const name=document.getElementById('m-name').value.trim();
  if(!name){ document.getElementById('m-name').focus(); return; }
  const jcVal=document.getElementById('m-jobcard').value;

  const startVal=document.getElementById('m-start').value;
  const endVal  =document.getElementById('m-end').value;
  const newTask={
    id:String(++nextId),
    taskTitle:name,
    jobcardNo:jcNo,
    taskStatus:document.getElementById('m-status').value,
    estCompDate:'',
    taskRandValue:parseFloat(document.getElementById('m-rand').value)||0,
    startDate:startVal?new Date(startVal):new Date(),
    endDate:endVal?new Date(endVal):new Date(Date.now()+3*86400000),
    taskDetails:document.getElementById('m-details').value,
    statusTimestamp:'',
    progressPct:0,
    completionRand:0,
    randOS:0,
    buildingSites:document.getElementById('m-site').value,
    statusUser:document.getElementById('m-user').value,
    statusNote:document.getElementById('m-note').value,
    color:selColor,
  };
  tasks.push(newTask);
  knownJobcards.add(jcNo);
  if(newTask.buildingSites) knownSites.add(newTask.buildingSites);
  persistNew(newTask);
  overlay.classList.remove('open');
  render();
});

/* ═══════════════════════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════════════════════ */
function statusCode(s){ const m={Done:'done','In Progress':'prog',Planned:'plan','On Hold':'hold'}; return m[s]||'plan'; }
function formatRand(v){ return Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function flashSave(){ const el=document.getElementById('save-flash'); el.classList.add('show'); clearTimeout(flashTimer); flashTimer=setTimeout(()=>el.classList.remove('show'),2400); }
