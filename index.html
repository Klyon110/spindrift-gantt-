<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spindrift Gantt</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f0f4f9;}
.hdr{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between;}
.hdr-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;}
.hdr-logo{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.hdr-tag{font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 9px;color:rgba(255,255,255,.8);}
.page{padding:14px;display:flex;flex-direction:column;gap:12px;}
.controls{background:#fff;border:1px solid #dde4f0;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.clbl{font-size:10px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;}
select,input[type=date]{border:1px solid #c5d0e8;border-radius:5px;padding:5px 8px;font-size:12px;color:#1a2340;background:#f7f9fc;}
.dnav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.dnav button{border:1px solid #c5d0e8;border-radius:5px;background:#f7f9fc;color:#6b7a99;cursor:pointer;font-size:14px;padding:3px 10px;}
.dnav button:hover{background:#dbeafe;color:#2563eb;}
.dlbl{font-size:11px;color:#6b7a99;min-width:155px;text-align:center;font-family:monospace;}
.btn-add{background:#2563eb;color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-add:hover{background:#1d4ed8;}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{background:#fff;border:1px solid #dde4f0;border-radius:8px;padding:10px 16px;flex:1;min-width:90px;}
.slbl{font-size:9px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;}
.sval{font-size:20px;font-weight:700;margin-top:2px;font-family:monospace;}
.board{background:#fff;border:1px solid #c5d0e8;border-radius:10px;overflow:hidden;}
.ghead{display:flex;height:40px;background:#f7f9fc;border-bottom:1px solid #c5d0e8;}
.lcol{width:250px;min-width:250px;border-right:1px solid #c5d0e8;display:flex;align-items:center;padding:0 14px;font-size:10px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;}
.dcols{flex:1;display:flex;}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #e8edf5;font-size:9px;color:#6b7a99;}
.dcol .dow{font-weight:700;text-transform:uppercase;}
.dcol .dom{font-size:13px;font-weight:600;font-family:monospace;}
.dcol.today{background:rgba(37,99,235,.06);}
.dcol.today .dom,.dcol.today .dow{color:#2563eb;}
.dcol.weekend{background:rgba(0,0,0,.015);}
.jch{display:flex;align-items:center;height:32px;background:#eef2f7;border-bottom:1px solid #dde4f0;padding:0 14px;gap:8px;cursor:pointer;user-select:none;}
.jch:hover{background:#dbeafe;}
.jcarr{font-size:10px;color:#6b7a99;display:inline-block;transition:transform .15s;}
.jcarr.open{transform:rotate(90deg);}
.jcnum{font-size:11px;font-weight:700;color:#2563eb;font-family:monospace;}
.jcsite{font-size:10px;color:#6b7a99;}
.jcpct{font-size:10px;font-weight:700;color:#16a34a;background:rgba(22,163,74,.12);border-radius:4px;padding:1px 6px;margin-left:auto;}
.jcrand{font-size:10px;color:#6b7a99;font-family:monospace;}
.bdg{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;border:1px solid;}
.bdg.done{background:#dcfce7;color:#15803d;border-color:#86efac;}
.bdg.prog{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;}
.bdg.plan{background:#f1f5f9;color:#64748b;border-color:#cbd5e1;}
.bdg.hold{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
.trow{display:flex;height:56px;border-bottom:1px solid #eef2f7;}
.trow:hover{background:rgba(37,99,235,.02);}
.tlbl{width:250px;min-width:250px;border-right:1px solid #dde4f0;padding:0 12px 0 22px;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer;}
.tname{font-size:12px;font-weight:600;color:#1a2340;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tdetail{font-size:9px;color:#6b7a99;}
.trand{font-size:9px;color:#7c3aed;font-family:monospace;}
.tuser{font-size:9px;color:#6b7a99;}
.tline{flex:1;position:relative;overflow:hidden;}
.grid{position:absolute;inset:0;display:flex;pointer-events:none;}
.gcol{flex:1;border-right:1px solid #eef2f7;}
.gcol.weekend{background:rgba(0,0,0,.015);}
.gcol.todaycol{background:rgba(37,99,235,.05);border-right-color:rgba(37,99,235,.2);}
.tmark{position:absolute;top:0;bottom:0;width:2px;background:#2563eb;opacity:.5;z-index:8;pointer-events:none;}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:32px;border-radius:6px;border:1px solid;display:flex;align-items:center;padding:0 8px;gap:5px;cursor:grab;font-size:11px;font-weight:600;overflow:hidden;z-index:5;transition:filter .1s,box-shadow .1s;white-space:nowrap;}
.bar:hover{filter:brightness(1.07);box-shadow:0 3px 10px rgba(0,0,0,.1);}
.bar:active{cursor:grabbing;}
.bar.dragging{opacity:.75;z-index:20;}
.bar.c1{background:#dbeafe;border-color:#3b82f6;color:#1e40af;}
.bar.c2{background:#dcfce7;border-color:#22c55e;color:#14532d;}
.bar.c3{background:#fef3c7;border-color:#f59e0b;color:#78350f;}
.bar.c4{background:#fce7f3;border-color:#ec4899;color:#831843;}
.bar.c5{background:#ede9fe;border-color:#8b5cf6;color:#4c1d95;}
.bar.c6{background:#ffedd5;border-color:#f97316;color:#7c2d12;}
.bname{flex:1;overflow:hidden;text-overflow:ellipsis;}
.bpct{font-size:9px;opacity:.7;font-family:monospace;flex-shrink:0;}
.ptrack{position:absolute;top:50%;transform:translateY(-50%);height:3px;background:rgba(22,163,74,.12);border-radius:2px;pointer-events:none;z-index:7;}
.pfill{height:100%;background:#16a34a;border-radius:2px;box-shadow:0 0 5px rgba(22,163,74,.4);position:relative;}
.pdot{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 6px rgba(22,163,74,.5);}
.empty{display:flex;align-items:center;justify-content:center;height:100px;color:#6b7a99;font-size:13px;}
/* Edit panel */
.epanel{background:#f7f9fc;border-top:1px solid #c5d0e8;border-bottom:1px solid #eef2f7;padding:12px 16px 14px 22px;}
.etitle{font-size:10px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.egrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ef{display:flex;flex-direction:column;gap:3px;}
.ef.full{grid-column:1/-1;}
.ef label{font-size:9px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;}
.ef input,.ef select,.ef textarea{border:1px solid #c5d0e8;border-radius:5px;padding:6px 8px;font-size:12px;color:#1a2340;background:#fff;outline:none;width:100%;font-family:Arial,sans-serif;}
.ef input:focus,.ef select:focus{border-color:#2563eb;}
.ef textarea{resize:none;height:44px;}
.pctrow{display:flex;gap:8px;align-items:center;}
.pctrow input[type=range]{flex:1;accent-color:#16a34a;}
.pctval{font-family:monospace;font-size:12px;font-weight:700;color:#16a34a;min-width:36px;text-align:right;}
.ebtns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid #eef2f7;}
.btn-close{padding:6px 13px;background:none;border:1px solid #c5d0e8;border-radius:5px;color:#6b7a99;font-size:11px;cursor:pointer;}
.btn-close:hover{border-color:#1a2340;color:#1a2340;}
.btn-zsave{padding:6px 15px;background:#2563eb;border:none;border-radius:5px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;}
.btn-zsave:hover{background:#1d4ed8;}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,30,60,.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.ov.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:12px;width:480px;max-width:calc(100vw - 24px);padding:22px;transform:translateY(10px);transition:transform .18s;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 12px 40px rgba(15,30,60,.18);}
.ov.open .modal{transform:translateY(0);}
.modal h2{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eef2f7;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mf{display:flex;flex-direction:column;gap:4px;}
.mf.full{grid-column:1/-1;}
.mf label{font-size:9px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.5px;}
.mf input,.mf select,.mf textarea{border:1px solid #c5d0e8;border-radius:6px;padding:7px 9px;font-size:12px;color:#1a2340;background:#f7f9fc;outline:none;width:100%;font-family:Arial,sans-serif;}
.mf input:focus,.mf select:focus{border-color:#2563eb;}
.mf textarea{resize:none;height:50px;}
.cprow{display:flex;gap:7px;margin-top:3px;}
.csw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s;}
.csw:hover{transform:scale(1.1);}
.csw.sel{border-color:#1a2340;}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid #eef2f7;}
.btn-mc{padding:7px 14px;background:none;border:1px solid #c5d0e8;border-radius:6px;color:#6b7a99;font-size:12px;cursor:pointer;}
.btn-ms{padding:7px 16px;background:#2563eb;border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.btn-ms:hover{background:#1d4ed8;}
/* Tooltip */
.tt{position:fixed;background:#fff;border:1px solid #c5d0e8;border-radius:8px;padding:10px 13px;font-size:11px;color:#1a2340;z-index:900;pointer-events:none;max-width:260px;box-shadow:0 6px 20px rgba(15,30,60,.12);opacity:0;transition:opacity .1s;}
.tt.show{opacity:1;}
.tt-t{font-weight:700;font-size:12px;margin-bottom:5px;}
.tt-r{display:flex;justify-content:space-between;gap:14px;padding:1px 0;font-size:10px;}
.tt-k{color:#6b7a99;}
.tt-v{font-family:monospace;font-weight:500;}
.tt-bar{height:4px;background:rgba(22,163,74,.15);border-radius:2px;margin-top:5px;}
.tt-bf{height:100%;background:#16a34a;border-radius:2px;}
/* Flash */
.flash{position:fixed;bottom:16px;right:16px;background:#f0fdf4;border:1px solid #86efac;color:#15803d;border-radius:7px;padding:9px 14px;font-size:12px;font-weight:700;z-index:400;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none;}
.flash.show{opacity:1;transform:translateY(0);}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#6b7a99;font-size:14px;gap:10px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">
    <div class="hdr-logo">SS</div>
    Spindrift Solutions
  </div>
  <span class="hdr-tag">Gantt Chart Sample</span>
</div>
<div class="page">
  <div class="controls">
    <span class="clbl">Site</span>
    <select id="f-site"><option value="">All sites</option></select>
    <span style="width:1px;height:20px;background:#c5d0e8;margin:0 2px;"></span>
    <span class="clbl">Status</span>
    <select id="f-status">
      <option value="">All</option>
      <option>In Progress</option>
      <option>Planned</option>
      <option>Done</option>
      <option>On Hold</option>
    </select>
    <span style="width:1px;height:20px;background:#c5d0e8;margin:0 2px;"></span>
    <span class="clbl">Jobcard</span>
    <select id="f-jc"><option value="">All jobcards</option></select>
    <div class="dnav">
      <button id="btn-prev">&#8249;</button>
      <span class="dlbl" id="dlbl">—</span>
      <button id="btn-next">&#8250;</button>
    </div>
    <button class="btn-add" id="btn-add">+ Add task</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="slbl">Total tasks</div><div class="sval" id="s-total" style="color:#1a2340">0</div></div>
    <div class="stat"><div class="slbl">Done</div><div class="sval" id="s-done" style="color:#15803d">0</div></div>
    <div class="stat"><div class="slbl">In Progress</div><div class="sval" id="s-prog" style="color:#1d4ed8">0</div></div>
    <div class="stat"><div class="slbl">Planned</div><div class="sval" id="s-plan" style="color:#64748b">0</div></div>
    <div class="stat"><div class="slbl">On Hold</div><div class="sval" id="s-hold" style="color:#92400e">0</div></div>
    <div class="stat"><div class="slbl">Total Rand</div><div class="sval" id="s-rand" style="color:#7c3aed;font-size:14px">R0</div></div>
    <div class="stat"><div class="slbl">Avg Progress</div><div class="sval" id="s-avg" style="color:#16a34a">0%</div></div>
  </div>
  <div class="board">
    <div class="ghead">
      <div class="lcol">Jobcard / Task</div>
      <div class="dcols" id="dcols"></div>
    </div>
    <div id="gbody"><div class="loading">&#9696; Loading data from Zoho...</div></div>
  </div>
</div>

<div class="tt" id="tt"></div>
<div class="flash" id="flash">&#10003; Saved to Zoho Creator</div>

<!-- Add Task Modal -->
<div class="ov" id="ov">
  <div class="modal">
    <h2>Add new task</h2>
    <div class="mgrid">
      <div class="mf full"><label>Task Title / Name *</label><input id="m-title" placeholder="e.g. Foundation excavation"></div>
      <div class="mf"><label>Jobcard No</label>
        <select id="m-jc"><option value="new">+ New jobcard</option></select>
      </div>
      <div class="mf"><label>New Jobcard No (if new)</label><input id="m-newjc" placeholder="e.g. JC-2025-041"></div>
      <div class="mf"><label>Task Details</label>
        <select id="m-details">
          <option value="">— select —</option>
          <option>Earthworks</option><option>Concrete</option><option>Steelwork</option>
          <option>Electrical</option><option>Plumbing</option><option>Finishes</option>
          <option>Inspection</option><option>Handover</option>
        </select>
      </div>
      <div class="mf"><label>Building Site</label><select id="m-site"><option value="">— select —</option></select></div>
      <div class="mf"><label>Date-Time Start Date *</label><input id="m-start" type="date"></div>
      <div class="mf"><label>Date-Time End Date *</label><input id="m-end" type="date"></div>
      <div class="mf"><label>Task Status</label>
        <select id="m-status">
          <option>Planned</option><option>In Progress</option><option>Done</option><option>On Hold</option>
        </select>
      </div>
      <div class="mf"><label>Task Estimated Completion Date</label><input id="m-estend" type="date"></div>
      <div class="mf"><label>Task Rand Value (R)</label><input id="m-rand" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <div class="mf"><label>Task Status User</label><input id="m-user" placeholder="e.g. John Smith"></div>
      <div class="mf full"><label>Task Status Note</label><textarea id="m-note" placeholder="Any notes or remarks..."></textarea></div>
      <div class="mf full"><label>Bar Colour</label>
        <div class="cprow" id="cprow">
          <div class="csw sel" data-c="1" style="background:#3b82f6;" title="Blue"></div>
          <div class="csw" data-c="2" style="background:#22c55e;" title="Green"></div>
          <div class="csw" data-c="3" style="background:#f59e0b;" title="Amber"></div>
          <div class="csw" data-c="4" style="background:#ec4899;" title="Pink"></div>
          <div class="csw" data-c="5" style="background:#8b5cf6;" title="Purple"></div>
          <div class="csw" data-c="6" style="background:#f97316;" title="Orange"></div>
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn-mc" id="btn-mc">Cancel</button>
      <button class="btn-ms" id="btn-ms">Save task to Zoho</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   ZOHO CONFIG — mapped to your exact form fields
   from your Gannt Chart Sample form
   ═══════════════════════════════════════════ */
var ZC = {
  appName:    'spindrift-solutions',
  reportName: 'All_Gannt_Chart_Samples',
  formName:   'Gannt_Chart_Sample',
  fields: {
    id:        'ID',
    title:     'Task_Title_name',
    jcNo:      'Jobcard_No',
    status:    'Task_Status',
    estEnd:    'Task_Estimated_Completion_Date',
    rand:      'Task_Rand_Value',
    start:     'Date_Time_Start_date',
    end:       'Date_Time_End_date',
    details:   'Task_Details',
    stamp:     'Task_Status_Time_Stamp',
    pct:       'Task_Progress_Completed',
    compRand:  'Task_Completion_Rand_Value',
    randOS:    'Task_Rand_Value_O_S',
    site:      'Building_Sites',
    user:      'Task_Status_User',
    note:      'Task_Status_Note',
    color:     'Color_Tag'
  }
};

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
var DAYS=14, tasks=[], nextId=5000, zohoOK=false, flashTmr;
var vStart=(function(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-3);return d;})();
var openJC=new Set(), openRows=new Set();
var sites=new Set(), jcards=new Set();
var fSite='', fStatus='', fJC='';
var selColor=1;

/* ═══════════════════════════════════════════
   ZOHO BRIDGE
   ═══════════════════════════════════════════ */
function init(){
  if(typeof ZOHO==='undefined'||!ZOHO.CREATOR){
    document.getElementById('gbody').innerHTML='<div class="loading" style="color:#f59e0b;">&#9888; Running outside Zoho — no live data. Add this widget to a Zoho Creator page to see your real records.</div>';
    renderStats([]);
    return;
  }
  ZOHO.CREATOR.init().then(function(){
    zohoOK=true;
    loadData();
  }).catch(function(e){
    document.getElementById('gbody').innerHTML='<div class="loading" style="color:#dc2626;">&#10007; Zoho SDK error: '+JSON.stringify(e)+'</div>';
  });
}

function loadData(){
  document.getElementById('gbody').innerHTML='<div class="loading">&#9696; Loading your Zoho data...</div>';
  ZOHO.CREATOR.DATA.getRecords({
    appName: ZC.appName,
    reportName: ZC.reportName,
    page: 1,
    pageSize: 500
  }).then(function(r){
    if(r && r.data && r.data.length > 0){
      tasks = r.data.map(fromZoho);
    } else {
      tasks = [];
    }
    buildFilters();
    renderDays();
    renderBody();
    renderStats(filtered());
  }).catch(function(e){
    document.getElementById('gbody').innerHTML='<div class="loading" style="color:#dc2626;">&#10007; Could not load records: '+JSON.stringify(e)+'<br><br>Check your reportName in ZC config.</div>';
  });
}

function fromZoho(rec){
  var f=ZC.fields;
  var sd=rec[f.start]?new Date(rec[f.start]):new Date();
  var ed=rec[f.end]?new Date(rec[f.end]):new Date();
  return {
    id:      String(rec[f.id]||''),
    title:   rec[f.title]||'Untitled',
    jcNo:    rec[f.jcNo]||'—',
    status:  rec[f.status]||'Planned',
    estEnd:  rec[f.estEnd]||'',
    rand:    parseFloat(rec[f.rand])||0,
    start:   sd,
    end:     ed,
    details: rec[f.details]||'',
    pct:     parseFloat(rec[f.pct])||0,
    compRand:parseFloat(rec[f.compRand])||0,
    randOS:  parseFloat(rec[f.randOS])||0,
    site:    rec[f.site]||'',
    user:    rec[f.user]||'',
    note:    rec[f.note]||'',
    color:   parseInt(rec[f.color])||1,
    zohoId:  rec[f.id]
  };
}

function toZoho(t){
  var f=ZC.fields, o={};
  o[f.title]   = t.title;
  o[f.jcNo]    = t.jcNo;
  o[f.status]  = t.status;
  o[f.rand]    = String(t.rand||0);
  o[f.start]   = fmt(t.start);
  o[f.end]     = fmt(t.end);
  o[f.details] = t.details||'';
  o[f.pct]     = String(t.pct||0);
  o[f.site]    = t.site||'';
  o[f.user]    = t.user||'';
  o[f.note]    = t.note||'';
  o[f.color]   = String(t.color||1);
  if(t.estEnd) o[f.estEnd]=t.estEnd;
  return o;
}

function saveUpdate(t){
  if(!zohoOK||!t.zohoId){showFlash();return;}
  ZOHO.CREATOR.DATA.updateRecord({
    appName:ZC.appName, reportName:ZC.reportName, id:t.zohoId, data:toZoho(t)
  }).then(showFlash).catch(function(e){alert('Save error: '+JSON.stringify(e));});
}

function saveNew(t){
  if(!zohoOK){showFlash();return;}
  ZOHO.CREATOR.DATA.addRecord({
    appName:ZC.appName, formName:ZC.formName, data:toZoho(t)
  }).then(function(r){
    if(r&&r.data&&r.data.ID) t.zohoId=r.data.ID;
    showFlash();
  }).catch(function(e){alert('Add error: '+JSON.stringify(e));});
}

/* ═══════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════ */
function fmt(d){if(!d)return'';try{return new Date(d).toISOString().slice(0,10);}catch(e){return '';}}
function fmtD(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}catch(e){return'—';}}
function rFmt(v){return Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sc(s){var m={Done:'done','In Progress':'prog',Planned:'plan','On Hold':'hold'};return m[s]||'plan';}
function showFlash(){var e=document.getElementById('flash');e.classList.add('show');clearTimeout(flashTmr);flashTmr=setTimeout(function(){e.classList.remove('show');},2400);}

/* ═══════════════════════════════════════════
   FILTERS & BUILD
   ═══════════════════════════════════════════ */
function buildFilters(){
  tasks.forEach(function(t){
    if(t.site) sites.add(t.site);
    if(t.jcNo&&t.jcNo!=='—') jcards.add(t.jcNo);
  });
  var se=document.getElementById('f-site');
  se.innerHTML='<option value="">All sites</option>'+
    Array.from(sites).sort().map(function(s){return'<option>'+esc(s)+'</option>';}).join('');
  var je=document.getElementById('f-jc');
  je.innerHTML='<option value="">All jobcards</option>'+
    Array.from(jcards).sort().map(function(j){return'<option>'+esc(j)+'</option>';}).join('');
}

function filtered(){
  return tasks.filter(function(t){
    if(fSite&&t.site!==fSite)return false;
    if(fStatus&&t.status!==fStatus)return false;
    if(fJC&&t.jcNo!==fJC)return false;
    return true;
  });
}

/* ═══════════════════════════════════════════
   RENDER DAYS
   ═══════════════════════════════════════════ */
function renderDays(){
  var c=document.getElementById('dcols');c.innerHTML='';
  var today=new Date();today.setHours(0,0,0,0);
  var ed=new Date(vStart);ed.setDate(vStart.getDate()+DAYS-1);
  document.getElementById('dlbl').textContent=
    vStart.toLocaleDateString('en-ZA',{day:'numeric',month:'short'})+' – '+
    ed.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'2-digit'});
  for(var i=0;i<DAYS;i++){
    var d=new Date(vStart);d.setDate(vStart.getDate()+i);
    var el=document.createElement('div');
    var isT=d.getTime()===today.getTime(),isW=d.getDay()===0||d.getDay()===6;
    el.className='dcol'+(isT?' today':'')+(isW?' weekend':'');
    el.innerHTML='<span class="dow">'+d.toLocaleDateString('en-ZA',{weekday:'short'})+'</span>'+
                 '<span class="dom">'+d.getDate()+'</span>';
    c.appendChild(el);
  }
}

/* ═══════════════════════════════════════════
   RENDER BODY
   ═══════════════════════════════════════════ */
function renderBody(){
  var body=document.getElementById('gbody');body.innerHTML='';
  var ft=filtered();
  if(!ft.length){
    body.innerHTML='<div class="empty">No tasks found — add one using the "+ Add task" button above.</div>';
    renderStats(ft);return;
  }
  var groups={};
  ft.forEach(function(t){if(!groups[t.jcNo])groups[t.jcNo]=[];groups[t.jcNo].push(t);});
  var today=new Date();today.setHours(0,0,0,0);
  var todayOff=Math.round((today-vStart)/864e5);

  Object.keys(groups).sort().forEach(function(jcNo){
    var jtasks=groups[jcNo];
    var isOpen=!openJC.has(jcNo);
    var avgPct=Math.round(jtasks.reduce(function(s,t){return s+t.pct;},0)/jtasks.length);
    var rand=jtasks.reduce(function(s,t){return s+t.rand;},0);
    var done=jtasks.filter(function(t){return t.status==='Done';}).length;
    var prog=jtasks.filter(function(t){return t.status==='In Progress';}).length;
    var hold=jtasks.filter(function(t){return t.status==='On Hold';}).length;
    var site=jtasks[0].site||'';

    /* jobcard header row */
    var hdr=document.createElement('div');hdr.className='jch';
    hdr.innerHTML='<span class="jcarr'+(isOpen?' open':'')+'">&#8250;</span>'+
      '<span class="jcnum">'+esc(jcNo)+'</span>'+
      (site?'<span class="jcsite">'+esc(site)+'</span>':'')+
      '<span style="margin-left:auto;display:flex;align-items:center;gap:8px;">'+
      (done?'<span class="bdg done">'+done+' done</span>':'')+
      (prog?'<span class="bdg prog">'+prog+' active</span>':'')+
      (hold?'<span class="bdg hold">'+hold+' on hold</span>':'')+
      '<span class="jcrand">R '+rFmt(rand)+'</span>'+
      '<span class="jcpct">'+avgPct+'%</span>'+
      '</span>';
    hdr.addEventListener('click',function(){
      if(openJC.has(jcNo))openJC.delete(jcNo);else openJC.add(jcNo);renderBody();
    });
    body.appendChild(hdr);

    if(!isOpen) return;

    jtasks.forEach(function(task){
      var wrap=document.createElement('div');

      /* task row */
      var row=document.createElement('div');row.className='trow';

      /* label */
      var lbl=document.createElement('div');lbl.className='tlbl';lbl.style.cursor='pointer';
      lbl.innerHTML='<span class="tname">'+esc(task.title)+'</span>'+
        '<div class="tmeta">'+
        '<span class="bdg '+sc(task.status)+'">'+esc(task.status)+'</span>'+
        (task.details?'<span class="tdetail">'+esc(task.details)+'</span>':'')+
        '</div>'+
        '<div class="tmeta">'+
        (task.user?'<span class="tuser">'+esc(task.user)+'</span>':'')+
        (task.rand?'<span class="trand">R '+rFmt(task.rand)+'</span>':'')+
        '</div>';
      lbl.addEventListener('click',function(){
        if(openRows.has(task.id))openRows.delete(task.id);else openRows.add(task.id);renderBody();
      });
      row.appendChild(lbl);

      /* timeline */
      var tl=document.createElement('div');tl.className='tline';
      /* grid */
      var gl=document.createElement('div');gl.className='grid';
      for(var i=0;i<DAYS;i++){
        var d=new Date(vStart);d.setDate(vStart.getDate()+i);
        var gc=document.createElement('div');
        gc.className='gcol'+(d.getDay()===0||d.getDay()===6?' weekend':'')+(i===todayOff?' todaycol':'');
        gl.appendChild(gc);
      }
      tl.appendChild(gl);
      /* today marker */
      if(todayOff>=0&&todayOff<DAYS){
        var tm=document.createElement('div');tm.className='tmark';
        tm.style.left=((todayOff+.5)/DAYS*100)+'%';tl.appendChild(tm);
      }

      /* bar */
      var sd=new Date(task.start);sd.setHours(0,0,0,0);
      var ed2=new Date(task.end);ed2.setHours(0,0,0,0);
      var sOff=Math.round((sd-vStart)/864e5);
      var eOff=Math.round((ed2-vStart)/864e5)+1;
      var dur=Math.max(1,eOff-sOff);
      var cL=Math.max(0,sOff),cR=Math.min(DAYS,eOff);

      if(cR>cL){
        var bar=document.createElement('div');
        bar.className='bar c'+task.color;
        bar.style.left=(cL/DAYS*100).toFixed(2)+'%';
        bar.style.width=((cR-cL)/DAYS*100).toFixed(2)+'%';
        bar.innerHTML='<span class="bname">'+esc(task.title)+'</span>'+
          (task.details?'<span style="font-size:9px;opacity:.6;font-family:monospace;flex-shrink:0;background:rgba(0,0,0,.07);border-radius:3px;padding:0 3px;">'+esc(task.details)+'</span>':'')+
          '<span class="bpct">'+task.pct+'%</span>';
        bar.addEventListener('mouseenter',function(e){showTT(e,task,sd,ed2,dur);});
        bar.addEventListener('mousemove',moveTT);
        bar.addEventListener('mouseleave',hideTT);
        attachDrag(bar,tl,task,dur);
        tl.appendChild(bar);

        /* progress line */
        if(task.pct>0){
          var pt=document.createElement('div');pt.className='ptrack';
          pt.style.left=(cL/DAYS*100).toFixed(2)+'%';
          pt.style.width=((cR-cL)/DAYS*100).toFixed(2)+'%';
          var pf=document.createElement('div');pf.className='pfill';
          pf.style.width=task.pct+'%';
          if(task.pct<100){var pd=document.createElement('div');pd.className='pdot';pf.appendChild(pd);}
          pt.appendChild(pf);tl.appendChild(pt);
        }
      }
      row.appendChild(tl);
      wrap.appendChild(row);

      /* inline edit panel */
      if(openRows.has(task.id)){
        var ep=document.createElement('div');ep.className='epanel';
        ep.innerHTML=buildEditPanel(task);
        wrap.appendChild(ep);
        wireEditPanel(ep,task);
      }
      body.appendChild(wrap);
    });
  });
  renderStats(ft);
}

/* ═══════════════════════════════════════════
   INLINE EDIT PANEL
   ═══════════════════════════════════════════ */
function buildEditPanel(t){
  var jcOpts=Array.from(jcards).sort().map(function(j){return'<option'+(j===t.jcNo?' selected':'')+'>'+esc(j)+'</option>';}).join('');
  var sOpts=Array.from(sites).sort().map(function(s){return'<option'+(s===t.site?' selected':'')+'>'+esc(s)+'</option>';}).join('');
  var stOpts=['Planned','In Progress','Done','On Hold'].map(function(s){return'<option'+(s===t.status?' selected':'')+'>'+s+'</option>';}).join('');
  var dtOpts=['','Earthworks','Concrete','Steelwork','Electrical','Plumbing','Finishes','Inspection','Handover']
    .map(function(d){return'<option'+(d===t.details?' selected':'')+'>'+d+'</option>';}).join('');
  return '<div class="etitle">Editing: '+esc(t.title)+' &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0;font-family:monospace">'+esc(t.jcNo)+'</span></div>'+
    '<div class="egrid">'+
    '<div class="ef" style="grid-column:1/-1"><label>Task Title / Name</label><input class="fp-title" value="'+esc(t.title)+'"></div>'+
    '<div class="ef"><label>Task Status</label><select class="fp-status">'+stOpts+'</select></div>'+
    '<div class="ef"><label>Jobcard No</label><select class="fp-jc">'+jcOpts+'</select></div>'+
    '<div class="ef"><label>Task Details</label><select class="fp-details">'+dtOpts+'</select></div>'+
    '<div class="ef"><label>Building Site</label><select class="fp-site"><option value="">—</option>'+sOpts+'</select></div>'+
    '<div class="ef"><label>Date-Time Start Date</label><input class="fp-start" type="date" value="'+fmt(t.start)+'"></div>'+
    '<div class="ef"><label>Date-Time End Date</label><input class="fp-end" type="date" value="'+fmt(t.end)+'"></div>'+
    '<div class="ef"><label>Est. Completion Date</label><input class="fp-estend" type="date" value="'+esc(t.estEnd||'')+'"></div>'+
    '<div class="ef"><label>Task Rand Value (R)</label><input class="fp-rand" type="number" value="'+t.rand+'" min="0" step="0.01"></div>'+
    '<div class="ef"><label>Completion Rand Value (R)</label><input class="fp-crand" type="number" value="'+(t.compRand||'')+'" min="0" step="0.01"></div>'+
    '<div class="ef"><label>Rand Value O/S (R)</label><input class="fp-oos" type="number" value="'+(t.randOS||'')+'" min="0" step="0.01"></div>'+
    '<div class="ef"><label>Task Status User</label><input class="fp-user" value="'+esc(t.user)+'"></div>'+
    '<div class="ef" style="grid-column:1/-1"><label>Task Progress Completed — <span class="fp-pct-lbl" style="color:#16a34a;font-family:monospace">'+t.pct+'%</span></label>'+
    '<div class="pctrow"><input class="fp-pct" type="range" min="0" max="100" step="5" value="'+t.pct+'">'+
    '<span class="fp-pct-val pctval">'+t.pct+'%</span></div></div>'+
    '<div class="ef" style="grid-column:1/-1"><label>Task Status Note</label>'+
    '<textarea class="fp-note">'+esc(t.note)+'</textarea></div>'+
    '</div>'+
    '<div class="ebtns">'+
    '<button class="btn-close fp-close">Close</button>'+
    '<button class="btn-zsave fp-save">Save to Zoho</button>'+
    '</div>';
}

function wireEditPanel(ep,task){
  var pct=ep.querySelector('.fp-pct');
  var pctV=ep.querySelector('.fp-pct-val');
  var pctL=ep.querySelector('.fp-pct-lbl');
  pct.addEventListener('input',function(){
    var v=parseInt(pct.value);
    pctV.textContent=v+'%';pctL.textContent=v+'%';task.pct=v;
  });
  ep.querySelector('.fp-close').addEventListener('click',function(){openRows.delete(task.id);renderBody();});
  ep.querySelector('.fp-save').addEventListener('click',function(){
    task.title  = ep.querySelector('.fp-title').value.trim()||task.title;
    task.status = ep.querySelector('.fp-status').value;
    task.jcNo   = ep.querySelector('.fp-jc').value;
    task.details= ep.querySelector('.fp-details').value;
    task.site   = ep.querySelector('.fp-site').value;
    task.start  = new Date(ep.querySelector('.fp-start').value);
    task.end    = new Date(ep.querySelector('.fp-end').value);
    task.estEnd = ep.querySelector('.fp-estend').value;
    task.rand   = parseFloat(ep.querySelector('.fp-rand').value)||0;
    task.compRand=parseFloat(ep.querySelector('.fp-crand').value)||0;
    task.randOS = parseFloat(ep.querySelector('.fp-oos').value)||0;
    task.user   = ep.querySelector('.fp-user').value;
    task.note   = ep.querySelector('.fp-note').value;
    task.pct    = parseInt(pct.value)||0;
    if(task.site) sites.add(task.site);
    saveUpdate(task);
    openRows.delete(task.id);
    renderBody();
  });
}

/* ═══════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════ */
function renderStats(ft){
  document.getElementById('s-total').textContent=ft.length;
  document.getElementById('s-done').textContent=ft.filter(function(t){return t.status==='Done';}).length;
  document.getElementById('s-prog').textContent=ft.filter(function(t){return t.status==='In Progress';}).length;
  document.getElementById('s-plan').textContent=ft.filter(function(t){return t.status==='Planned';}).length;
  document.getElementById('s-hold').textContent=ft.filter(function(t){return t.status==='On Hold';}).length;
  document.getElementById('s-rand').textContent='R '+rFmt(ft.reduce(function(s,t){return s+t.rand;},0));
  var avg=ft.length?Math.round(ft.reduce(function(s,t){return s+t.pct;},0)/ft.length):0;
  document.getElementById('s-avg').textContent=avg+'%';
}

/* ═══════════════════════════════════════════
   DRAG
   ═══════════════════════════════════════════ */
function attachDrag(bar,tl,task,dur){
  bar.addEventListener('mousedown',function(e){
    e.preventDefault();
    var tlR=tl.getBoundingClientRect(),dayPx=tlR.width/DAYS;
    var orig=new Date(task.start);orig.setHours(0,0,0,0);
    var sx=e.clientX;bar.classList.add('dragging');
    function mv(ev){
      var delta=Math.round((ev.clientX-sx)/dayPx);
      var ns=new Date(orig);ns.setDate(orig.getDate()+delta);
      var off=Math.round((ns-vStart)/864e5);
      bar.style.left=(Math.max(0,off)/DAYS*100)+'%';
      task._ds=ns;task._de=new Date(ns);task._de.setDate(ns.getDate()+dur-1);
    }
    function up(){
      bar.classList.remove('dragging');
      if(task._ds){task.start=task._ds;task.end=task._de;delete task._ds;delete task._de;saveUpdate(task);renderBody();}
      document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    }
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

/* ═══════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════ */
var ttEl=document.getElementById('tt');
function showTT(e,t,sd,ed,dur){
  ttEl.innerHTML='<div class="tt-t">'+esc(t.title)+'</div>'+
    '<div class="tt-r"><span class="tt-k">Jobcard</span><span class="tt-v">'+esc(t.jcNo)+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">Site</span><span class="tt-v">'+esc(t.site||'—')+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">Type</span><span class="tt-v">'+esc(t.details||'—')+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">Start</span><span class="tt-v">'+fmtD(sd)+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">End</span><span class="tt-v">'+fmtD(ed)+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">Duration</span><span class="tt-v">'+dur+'d</span></div>'+
    '<div class="tt-r"><span class="tt-k">Rand value</span><span class="tt-v">R '+rFmt(t.rand)+'</span></div>'+
    '<div class="tt-r"><span class="tt-k">Progress</span><span class="tt-v">'+t.pct+'%</span></div>'+
    '<div class="tt-bar"><div class="tt-bf" style="width:'+t.pct+'%"></div></div>'+
    (t.user?'<div class="tt-r" style="margin-top:4px"><span class="tt-k">User</span><span class="tt-v">'+esc(t.user)+'</span></div>':'')+
    (t.note?'<div style="font-size:10px;color:#6b7a99;font-style:italic;margin-top:4px">'+esc(t.note)+'</div>':'');
  ttEl.className='tt show';moveTT(e);
}
function moveTT(e){ttEl.style.left=Math.min(e.clientX+14,window.innerWidth-ttEl.offsetWidth-8)+'px';ttEl.style.top=Math.min(e.clientY-10,window.innerHeight-ttEl.offsetHeight-8)+'px';}
function hideTT(){ttEl.className='tt';}

/* ═══════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════ */
document.getElementById('f-site').addEventListener('change',function(e){fSite=e.target.value;renderBody();});
document.getElementById('f-status').addEventListener('change',function(e){fStatus=e.target.value;renderBody();});
document.getElementById('f-jc').addEventListener('change',function(e){fJC=e.target.value;renderBody();});
document.getElementById('btn-prev').addEventListener('click',function(){vStart.setDate(vStart.getDate()-DAYS);renderDays();renderBody();});
document.getElementById('btn-next').addEventListener('click',function(){vStart.setDate(vStart.getDate()+DAYS);renderDays();renderBody();});

/* ═══════════════════════════════════════════
   ADD TASK MODAL
   ═══════════════════════════════════════════ */
var ov=document.getElementById('ov');
document.getElementById('btn-add').addEventListener('click',function(){
  document.getElementById('m-title').value='';
  document.getElementById('m-start').value=fmt(new Date());
  document.getElementById('m-end').value=fmt(new Date(Date.now()+3*86400000));
  document.getElementById('m-status').value='Planned';
  document.getElementById('m-rand').value='';
  document.getElementById('m-user').value='';
  document.getElementById('m-note').value='';
  var je=document.getElementById('m-jc');
  je.innerHTML='<option value="new">+ New jobcard</option>'+
    Array.from(jcards).sort().map(function(j){return'<option value="'+esc(j)+'">'+esc(j)+'</option>';}).join('');
  var se=document.getElementById('m-site');
  se.innerHTML='<option value="">— select —</option>'+
    Array.from(sites).sort().map(function(s){return'<option>'+esc(s)+'</option>';}).join('');
  selColor=1;updateCP();
  ov.classList.add('open');
  setTimeout(function(){document.getElementById('m-title').focus();},100);
});
document.getElementById('btn-mc').addEventListener('click',function(){ov.classList.remove('open');});
ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('open');});
document.getElementById('cprow').addEventListener('click',function(e){
  var sw=e.target.closest('.csw');if(!sw)return;
  selColor=parseInt(sw.dataset.c);updateCP();
});
function updateCP(){document.querySelectorAll('.csw').forEach(function(s){s.classList.toggle('sel',parseInt(s.dataset.c)===selColor);});}

document.getElementById('btn-ms').addEventListener('click',function(){
  var title=document.getElementById('m-title').value.trim();
  if(!title){document.getElementById('m-title').focus();return;}
  var jcV=document.getElementById('m-jc').value;
  var jcNo=jcV==='new'?(document.getElementById('m-newjc').value.trim()||'JC-NEW'):jcV;
  var t={
    id:String(++nextId),title:title,jcNo:jcNo,
    status:document.getElementById('m-status').value,
    rand:parseFloat(document.getElementById('m-rand').value)||0,
    start:new Date(document.getElementById('m-start').value||Date.now()),
    end:new Date(document.getElementById('m-end').value||Date.now()+3*86400000),
    estEnd:document.getElementById('m-estend').value||'',
    details:document.getElementById('m-details').value,
    pct:0,compRand:0,randOS:0,
    site:document.getElementById('m-site').value,
    user:document.getElementById('m-user').value,
    note:document.getElementById('m-note').value,
    color:selColor
  };
  tasks.push(t);
  jcards.add(jcNo);
  if(t.site)sites.add(t.site);
  saveNew(t);
  ov.classList.remove('open');
  buildFilters();
  renderBody();
});

init();
